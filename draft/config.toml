# =====================================================================================================================
# PR Security Review — единый файл настроек. Программа клонирует данные PR и готовит их к ИИ-ревью;
# к LLM не обращается (ревью делает ИИ-ассистент в редакторе по промпту из рабочего каталога).
# Секрет ADO PAT задаётся только переменной окружения (ADO_PAT или DEPP_BOT_TOKEN).
# TLS-верификация включена всегда; корпоративный корневой сертификат — переменная REQUESTS_CA_BUNDLE.
# =====================================================================================================================

# ---------------------------------------------------------------------------------------------------------------------
# Azure DevOps Server
# ---------------------------------------------------------------------------------------------------------------------
[ado]
org_url = "https://tfs.c.primaryorg.ru/tfs/PrimaryOrg"   # адрес коллекции ADO Server
api_version = "5.1"                               # версия REST API ADO
request_timeout_sec = 30                          # таймаут служебных запросов к ADO
# Корпоративный корневой CA (PEM): используется для REST (requests) и для git (http.sslCAInfo).
# Путь относительно корня проекта или абсолютный. Можно не задавать, если задано REQUESTS_CA_BUNDLE
# (для REST) и корневой сертификат установлен в хранилище Windows (для git).
ca_bundle = "certs/SOINH_ROOT_CA.pem"

# ---------------------------------------------------------------------------------------------------------------------
# Подготовка данных PR
# ---------------------------------------------------------------------------------------------------------------------
[review]
prompt_file = "prompts/security_review.md"   # СИСТЕМНЫЙ ПРОМПТ ревью (копируется в рабочий каталог PR как prompt.md)
context_lines = 8                            # строк контекста вокруг изменений в diff.patch
merge_fetch_depth = 2                        # глубина выгрузки merge-коммита PR (merge + оба родителя)
git_timeout_sec = 600                        # таймаут git-команд при клонировании и чтении diff
fetch_retries = 3                            # попыток git fetch при сетевых сбоях
fetch_retry_pause_sec = [5, 15]              # паузы между попытками fetch
max_release_commits = 10000                  # защитный лимит полного обхода base..head релиза

# ---------------------------------------------------------------------------------------------------------------------
# Пути (относительно корня проекта; можно задать абсолютные)
# ---------------------------------------------------------------------------------------------------------------------
[paths]
workspace_root = "workspace"   # рабочие каталоги PR: workspace/pr_<ID>/ (клон, diff, комментарии; чистит cleanup.py)
inputs_root = "inputs"         # СЮДА кладёте свои файлы (отчёты, выгрузки) — копируются в context/ рабочего каталога
