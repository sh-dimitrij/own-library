<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datalog — Тест для самопроверки</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e12;
    --bg2: #16161e;
    --bg3: #1e1e2a;
    --surface: #22222f;
    --surface2: #2a2a3a;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --accent: #7c6af7;
    --accent2: #a594ff;
    --accent-glow: rgba(124, 106, 247, 0.25);
    --green: #3ecf8e;
    --green-bg: rgba(62, 207, 142, 0.12);
    --red: #f46b6b;
    --red-bg: rgba(244, 107, 107, 0.12);
    --amber: #f5a623;
    --amber-bg: rgba(245, 166, 35, 0.10);
    --text: #e8e8f0;
    --text2: #9999b5;
    --text3: #5e5e7a;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Unbounded', sans-serif;
    --body: 'Golos Text', sans-serif;
    --radius: 12px;
    --radius-lg: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,106,247,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,106,247,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 800px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }

  header {
    padding: 56px 0 40px;
    text-align: center;
  }

  .badge {
    display: inline-block;
    background: var(--accent-glow);
    border: 1px solid rgba(124,106,247,0.4);
    color: var(--accent2);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 40px;
    margin-bottom: 20px;
  }

  h1 {
    font-family: var(--display);
    font-size: clamp(22px, 5vw, 38px);
    font-weight: 700;
    line-height: 1.15;
    color: var(--text);
    margin-bottom: 12px;
    letter-spacing: -0.02em;
  }

  h1 span { color: var(--accent2); }

  .subtitle {
    color: var(--text2);
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .scoreboard {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 40px;
  }

  .score-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 12px;
    text-align: center;
  }

  .score-card .val {
    font-family: var(--display);
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    display: block;
  }

  .score-card .lbl {
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 3px;
    display: block;
  }

  .score-card.s-green .val { color: var(--green); }
  .score-card.s-red .val { color: var(--red); }
  .score-card.s-amber .val { color: var(--amber); }
  .score-card.s-accent .val { color: var(--accent2); }

  .progress-bar {
    width: 100%;
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    margin-bottom: 40px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 12px;
    padding-left: 2px;
  }

  .question-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }

  .question-card:hover { border-color: var(--border2); }

  .question-card.answered-correct {
    border-color: rgba(62, 207, 142, 0.4);
    background: linear-gradient(135deg, var(--bg2) 0%, rgba(62,207,142,0.04) 100%);
  }

  .question-card.answered-wrong {
    border-color: rgba(244, 107, 107, 0.4);
    background: linear-gradient(135deg, var(--bg2) 0%, rgba(244,107,107,0.04) 100%);
  }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 18px;
  }

  .q-num {
    background: var(--surface);
    border: 1px solid var(--border2);
    color: var(--text3);
    font-family: var(--mono);
    font-size: 11px;
    min-width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
    transition: all 0.2s;
  }

  .answered-correct .q-num {
    background: var(--green-bg);
    border-color: rgba(62,207,142,0.4);
    color: var(--green);
  }

  .answered-wrong .q-num {
    background: var(--red-bg);
    border-color: rgba(244,107,107,0.4);
    color: var(--red);
  }

  .q-category {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent2);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 5px;
    opacity: 0.7;
  }

  .q-text {
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    font-weight: 500;
  }

  .q-text code {
    font-family: var(--mono);
    font-size: 13px;
    background: var(--surface);
    color: var(--accent2);
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  .options {
    display: grid;
    gap: 8px;
  }

  .option-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text2);
    font-family: var(--body);
    font-size: 14px;
    line-height: 1.5;
    padding: 12px 16px;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    transition: all 0.15s ease;
    width: 100%;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--border2);
    background: var(--surface2);
    color: var(--text);
  }

  .option-btn:disabled { cursor: default; }

  .option-btn .opt-key {
    font-family: var(--mono);
    font-size: 11px;
    background: var(--bg3);
    border: 1px solid var(--border2);
    color: var(--text3);
    width: 22px;
    height: 22px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
    transition: all 0.15s;
  }

  .option-btn .opt-text { flex: 1; }

  .option-btn .opt-text code {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--bg3);
    color: var(--accent2);
    padding: 1px 5px;
    border-radius: 3px;
  }

  .option-btn.correct {
    background: var(--green-bg);
    border-color: rgba(62,207,142,0.5);
    color: var(--green);
  }

  .option-btn.correct .opt-key {
    background: var(--green-bg);
    border-color: var(--green);
    color: var(--green);
  }

  .option-btn.wrong {
    background: var(--red-bg);
    border-color: rgba(244,107,107,0.5);
    color: var(--red);
  }

  .option-btn.wrong .opt-key {
    background: var(--red-bg);
    border-color: var(--red);
    color: var(--red);
  }

  .option-btn.missed {
    background: var(--amber-bg);
    border-color: rgba(245,166,35,0.4);
    color: var(--amber);
  }

  .explanation {
    margin-top: 14px;
    padding: 14px 16px;
    background: var(--bg3);
    border-radius: 10px;
    border-left: 3px solid var(--accent);
    font-size: 13px;
    color: var(--text2);
    line-height: 1.65;
    display: none;
  }

  .explanation.show { display: block; }

  .explanation code {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--surface);
    color: var(--accent2);
    padding: 1px 5px;
    border-radius: 3px;
  }

  .explanation strong { color: var(--text); font-weight: 600; }

  .result-panel {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: var(--radius-lg);
    padding: 36px 32px;
    text-align: center;
    display: none;
    margin-top: 20px;
  }

  .result-panel.show { display: block; }

  .result-emoji {
    font-size: 56px;
    margin-bottom: 16px;
    display: block;
    line-height: 1;
  }

  .result-title {
    font-family: var(--display);
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }

  .result-sub {
    color: var(--text2);
    font-size: 15px;
    margin-bottom: 28px;
  }

  .result-score-big {
    font-family: var(--display);
    font-size: 56px;
    font-weight: 700;
    color: var(--accent2);
    display: block;
    line-height: 1;
    margin-bottom: 4px;
  }

  .result-score-label {
    font-size: 13px;
    color: var(--text3);
    margin-bottom: 28px;
    display: block;
  }

  .restart-btn {
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: white;
    font-family: var(--display);
    font-size: 14px;
    font-weight: 600;
    padding: 14px 36px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.01em;
  }

  .restart-btn:hover {
    background: var(--accent2);
    transform: translateY(-1px);
  }

  .topics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
    margin-bottom: 36px;
  }

  .topic-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 40px;
    padding: 7px 14px;
    font-size: 12px;
    color: var(--text2);
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    font-family: var(--body);
  }

  .topic-pill:hover, .topic-pill.active {
    background: var(--accent-glow);
    border-color: rgba(124,106,247,0.5);
    color: var(--accent2);
  }

  .filter-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .filter-row label {
    font-size: 13px;
    color: var(--text3);
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  @media (max-width: 560px) {
    .scoreboard { grid-template-columns: repeat(2, 1fr); }
    header { padding: 36px 0 28px; }
    .question-card { padding: 20px; }
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="wrapper">

  <header>
    <div class="badge">Постреляционные БД · Лекция №6</div>
    <h1>Тест по языку<br><span>Datalog</span></h1>
    <p class="subtitle">50 вопросов для подготовки к рубежному контролю.<br>Выберите вариант ответа — получите объяснение.</p>
  </header>

  <div class="scoreboard">
    <div class="score-card s-accent"><span class="val" id="sc-total">50</span><span class="lbl">Вопросов</span></div>
    <div class="score-card s-green"><span class="val" id="sc-correct">0</span><span class="lbl">Верно</span></div>
    <div class="score-card s-red"><span class="val" id="sc-wrong">0</span><span class="lbl">Неверно</span></div>
    <div class="score-card s-amber"><span class="val" id="sc-pct">0%</span><span class="lbl">Результат</span></div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <div id="quiz-container"></div>

  <div class="result-panel" id="result-panel">
    <span class="result-emoji" id="res-emoji">🎉</span>
    <div class="result-title" id="res-title">Отличный результат!</div>
    <div class="result-sub" id="res-sub">Вы готовы к защите рубежного контроля</div>
    <span class="result-score-big" id="res-score">48/50</span>
    <span class="result-score-label">правильных ответов</span>
    <br>
    <button class="restart-btn" onclick="restart()">Пройти снова</button>
  </div>

</div>

<script>
const questions = [
  {
    cat: "Основы",
    q: "Как расшифровывается Datalog?",
    opts: ["Data Language", "Database Logic", "Declarative Logic", "Data Logical Query"],
    ans: 1,
    exp: "<strong>Database Logic</strong> — логический язык для работы с базами данных. Datalog является декларативным языком запросов, основанным на логике предикатов первого порядка."
  },
  {
    cat: "Основы",
    q: "Какой тип языка представляет собой Datalog?",
    opts: ["Процедурный", "Объектно-ориентированный", "Декларативный", "Императивный"],
    ans: 2,
    exp: "Datalog — <strong>декларативный</strong> язык: вы описываете <em>что</em> хотите получить (логические условия), а не <em>как</em> это вычислить. Это принципиально отличает его от процедурных языков."
  },
  {
    cat: "Основы",
    q: "Что является альтернативой Datalog в реляционных СУБД?",
    opts: ["XML-запросы", "Реляционная алгебра", "Граф запросы", "ООП-запросы"],
    ans: 1,
    exp: "Datalog является <strong>альтернативой реляционной алгебре</strong>. Оба подхода позволяют делать запросы к реляционным БД, но Datalog использует логику предикатов, а реляционная алгебра — операции над отношениями."
  },
  {
    cat: "Предикаты и атомы",
    q: "Что такое предикат в Datalog?",
    opts: [
      "Таблица в базе данных",
      "Аналог вызова функции с фиксированным числом аргументов",
      "Переменная с типом данных",
      "Оператор сравнения"
    ],
    ans: 1,
    exp: "Предикат — <strong>аналог вызова функции</strong> в языках программирования. У предиката всегда фиксированное количество аргументов (арность). Предикат с конкретными аргументами называется атомом."
  },
  {
    cat: "Предикаты и атомы",
    q: "Что возвращает атом при вычислении?",
    opts: ["Число", "Строку", "TRUE или FALSE", "Список кортежей"],
    ans: 2,
    exp: "Атом — это логическая функция, которая возвращает <strong>TRUE или FALSE</strong>. Например, <code>R(1,2)</code> вернёт TRUE, если кортеж (1,2) содержится в отношении R."
  },
  {
    cat: "Предикаты и атомы",
    q: "Какие аргументы может принимать предикат?",
    opts: ["Только константы", "Только переменные", "Константы и переменные", "Только числа"],
    ans: 2,
    exp: "Аргументами предиката могут быть как <strong>константы</strong> (конкретные значения, например 'Мосфильм'), так и <strong>переменные</strong> (обозначения, которые принимают разные значения при вычислении правила)."
  },
  {
    cat: "Предикаты и атомы",
    q: "Что означает <code>Person(\"Иванов\", 35, \"Москва\")</code>?",
    opts: [
      "Создание записи в таблице Person",
      "Проверка: является ли (Иванов, 35, Москва) кортежем отношения Person",
      "Удаление кортежа из Person",
      "Обновление атрибута возраста"
    ],
    ans: 1,
    exp: "Реляционный атом <code>Person(\"Иванов\", 35, \"Москва\")</code> — это <strong>проверка</strong>: вернёт TRUE, если такой кортеж существует в отношении Person, иначе FALSE. Это не операция записи или удаления."
  },
  {
    cat: "Предикаты и атомы",
    q: "Чем отличаются реляционные атомы от арифметических?",
    opts: [
      "Реляционные бесконечны, арифметические конечны",
      "Реляционные конечны и изменяемы, арифметические бесконечны и неизменны",
      "Оба типа конечны",
      "Нет различий"
    ],
    ans: 1,
    exp: "<strong>Реляционные атомы</strong> конечны (зависят от данных в таблице) и изменяемы (меняются при изменении БД). <strong>Арифметические атомы</strong> задают бесконечное неизменное множество — например, <code>x &gt; 5</code> истинно для бесконечно многих пар значений."
  },
  {
    cat: "Предикаты и атомы",
    q: "Какой оператор используется для обозначения «не равно» в арифметических атомах Datalog?",
    opts: ["!=", "NOT =", "<>", "≠"],
    ans: 2,
    exp: "В Datalog для обозначения «не равно» используется оператор <code>&lt;&gt;</code>. Например: <code>н2 &lt;&gt; н</code> означает «значение н2 не равно значению н»."
  },
  {
    cat: "Правила",
    q: "Какова структура правила Datalog?",
    opts: [
      "SELECT ... FROM ... WHERE",
      "Заголовок ← Тело",
      "Тело → Заголовок",
      "IF Тело THEN Заголовок END"
    ],
    ans: 1,
    exp: "Правило Datalog имеет вид: <strong>Заголовок ← Тело</strong>. Заголовок — результирующий атом, тело — подцели (условия). Читается: «заголовок истинен, если истинно всё тело»."
  },
  {
    cat: "Правила",
    q: "Как называются части тела правила Datalog?",
    opts: ["Части", "Подцели (subgoals)", "Операнды", "Предложения"],
    ans: 1,
    exp: "Части тела правила называются <strong>подцелями (subgoals)</strong>. Подцели соединяются оператором AND и могут быть реляционными или арифметическими атомами, с отрицанием NOT или без."
  },
  {
    cat: "Правила",
    q: "Какой оператор соединяет подцели в теле правила Datalog?",
    opts: ["OR", "AND", "XOR", "NOT"],
    ans: 1,
    exp: "Подцели в теле правила соединяются оператором <strong>AND</strong>. Все подцели должны быть истинны одновременно, чтобы правило вывело кортеж в результирующее отношение."
  },
  {
    cat: "Правила",
    q: "Что такое анонимная переменная в Datalog?",
    opts: [
      "Переменная без имени, встречающаяся один раз, обозначается «_»",
      "Глобальная переменная всего запроса",
      "Переменная с числовым именем",
      "Константа без кавычек"
    ],
    ans: 0,
    exp: "Анонимная переменная обозначается символом <strong>«_»</strong> (подчёркивание). Используется, когда значение атрибута не нужно в результате и упоминается лишь один раз. Каждое «_» — отдельная независимая переменная."
  },
  {
    cat: "Правила",
    q: "Что означает запись: <code>Н(н,г) ← Фильм(н,г,_,_,_,ст,_) AND ст='Нева'</code>?",
    opts: [
      "Вставить запись в таблицу Н",
      "Выбрать название и год фильмов студии Нева",
      "Удалить фильмы студии Нева",
      "Обновить студию всех фильмов"
    ],
    ans: 1,
    exp: "Это правило <strong>выбирает</strong> атрибуты название (<code>н</code>) и год (<code>г</code>) из таблицы Фильм. Символы «_» означают атрибуты, которые нам не нужны. Условие <code>ст='Нева'</code> фильтрует только фильмы этой студии."
  },

let correct = 0, wrong = 0, answered = 0;
const total = questions.length;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';

  const cats = {};
  questions.forEach((q, i) => {
    if (!cats[q.cat]) cats[q.cat] = [];
    cats[q.cat].push({ ...q, globalIdx: i });
  });

  let qNum = 1;
  Object.entries(cats).forEach(([cat, qs]) => {
    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = '// ' + cat;
    container.appendChild(label);

    qs.forEach(q => {
      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = 'q-' + q.globalIdx;

      const keys = ['A', 'B', 'C', 'D'];
      const optionsHtml = q.opts.map((opt, oi) =>
        `<button class="option-btn" onclick="answer(${q.globalIdx}, ${oi}, ${q.ans})" id="opt-${q.globalIdx}-${oi}">
          <span class="opt-key">${keys[oi]}</span>
          <span class="opt-text">${opt.replace(/`([^`]+)`/g, '<code>$1</code>')}</span>
        </button>`
      ).join('');

      card.innerHTML = `
        <div class="q-header">
          <div class="q-num" id="qnum-${q.globalIdx}">${qNum}</div>
          <div>
            <div class="q-category">${q.cat}</div>
            <div class="q-text">${q.q.replace(/`([^`]+)`/g, '<code>$1</code>')}</div>
          </div>
        </div>
        <div class="options">${optionsHtml}</div>
        <div class="explanation" id="exp-${q.globalIdx}">${q.exp}</div>
      `;
      container.appendChild(card);
      qNum++;
    });
  });
}

function answer(qIdx, chosen, correct_ans) {
  const btns = document.querySelectorAll(`[id^="opt-${qIdx}-"]`);
  btns.forEach(b => b.disabled = true);

  const card = document.getElementById('q-' + qIdx);
  const exp = document.getElementById('exp-' + qIdx);
  exp.classList.add('show');

  if (chosen === correct_ans) {
    btns[chosen].classList.add('correct');
    card.classList.add('answered-correct');
    correct++;
    document.getElementById('sc-correct').textContent = correct;
  } else {
    btns[chosen].classList.add('wrong');
    btns[correct_ans].classList.add('missed');
    card.classList.add('answered-wrong');
    wrong++;
    document.getElementById('sc-wrong').textContent = wrong;
  }

  answered++;
  const pct = Math.round((correct / answered) * 100);
  document.getElementById('sc-pct').textContent = pct + '%';
  document.getElementById('progress').style.width = (answered / total * 100) + '%';

  if (answered === total) showResult();
}

function showResult() {
  const pct = Math.round((correct / total) * 100);
  let emoji, title, sub;
  if (pct >= 90) { emoji = '🏆'; title = 'Превосходно!'; sub = 'Вы отлично знаете Datalog — готовы к защите!'; }
  else if (pct >= 70) { emoji = '✅'; title = 'Хороший результат!'; sub = 'Ещё немного — и вы будете идеально готовы.'; }
  else if (pct >= 50) { emoji = '📚'; title = 'Неплохо, но есть пробелы'; sub = 'Повторите темы с ошибками перед защитой.'; }
  else { emoji = '🔁'; title = 'Нужно повторить тему'; sub = 'Перечитайте лекцию и пройдите тест заново.'; }

  document.getElementById('res-emoji').textContent = emoji;
  document.getElementById('res-title').textContent = title;
  document.getElementById('res-sub').textContent = sub;
  document.getElementById('res-score').textContent = correct + '/' + total;
  document.getElementById('result-panel').classList.add('show');
  document.getElementById('result-panel').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function restart() {
  correct = 0; wrong = 0; answered = 0;
  document.getElementById('sc-correct').textContent = 0;
  document.getElementById('sc-wrong').textContent = 0;
  document.getElementById('sc-pct').textContent = '0%';
  document.getElementById('progress').style.width = '0%';
  document.getElementById('result-panel').classList.remove('show');
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuiz();
</script>
