<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoSQL — Тест для самопроверки</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Unbounded:wght@400;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --bg2: #161a22;
    --bg3: #1e2330;
    --border: #2a3040;
    --border2: #3a4455;
    --text: #e8ecf4;
    --text2: #8899aa;
    --text3: #556070;
    --accent: #4f9eff;
    --accent2: #7b5ea7;
    --green: #3ecf8e;
    --red: #f55;
    --amber: #ffa94d;
    --card-r: 12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  .hero {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 48px 32px 36px;
    text-align: center;
  }

  .hero-tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--accent);
    background: rgba(79,158,255,0.1);
    border: 1px solid rgba(79,158,255,0.25);
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 20px;
    text-transform: uppercase;
  }

  h1 {
    font-family: 'Unbounded', sans-serif;
    font-size: clamp(22px, 5vw, 36px);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #e8ecf4 0%, #8899aa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }

  .hero-sub {
    color: var(--text2);
    font-size: 14px;
    max-width: 500px;
    margin: 0 auto 28px;
  }

  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 32px;
    flex-wrap: wrap;
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    font-family: 'Unbounded', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
  }

  .stat-label {
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  .progress-wrap {
    padding: 20px 32px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 13px;
  }

  .progress-label { color: var(--text2); }

  .progress-score {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--accent);
  }

  .progress-track {
    height: 4px;
    background: var(--bg3);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  .section-label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 40px 0 16px;
  }

  .section-label span:first-child {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .question-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--card-r);
    padding: 24px;
    margin-bottom: 14px;
    transition: border-color 0.2s;
  }

  .question-card.answered-correct {
    border-color: rgba(62,207,142,0.4);
    background: rgba(62,207,142,0.04);
  }

  .question-card.answered-wrong {
    border-color: rgba(255,85,85,0.3);
    background: rgba(255,85,85,0.03);
  }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 16px;
  }

  .q-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    background: rgba(79,158,255,0.1);
    border: 1px solid rgba(79,158,255,0.2);
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
    margin-top: 1px;
    flex-shrink: 0;
  }

  .q-text {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.5;
    color: var(--text);
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 11px 14px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 14px;
    color: var(--text2);
    line-height: 1.4;
  }

  .option:hover:not(.disabled) {
    border-color: var(--border2);
    color: var(--text);
    background: #232b3a;
  }

  .option.correct {
    border-color: var(--green);
    background: rgba(62,207,142,0.1);
    color: var(--green);
  }

  .option.wrong {
    border-color: var(--red);
    background: rgba(255,85,85,0.08);
    color: var(--red);
  }

  .option.reveal {
    border-color: rgba(62,207,142,0.4);
    background: rgba(62,207,142,0.05);
    color: var(--green);
  }

  .option.disabled { cursor: default; }

  .opt-letter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    width: 20px;
    height: 20px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg2);
    border: 1px solid var(--border2);
    flex-shrink: 0;
    margin-top: 1px;
  }

  .option.correct .opt-letter { background: rgba(62,207,142,0.2); border-color: var(--green); color: var(--green); }
  .option.wrong .opt-letter { background: rgba(255,85,85,0.15); border-color: var(--red); color: var(--red); }
  .option.reveal .opt-letter { background: rgba(62,207,142,0.1); border-color: rgba(62,207,142,0.4); color: var(--green); }

  .explanation {
    display: none;
    margin-top: 14px;
    padding: 12px 14px;
    background: rgba(79,158,255,0.06);
    border: 1px solid rgba(79,158,255,0.15);
    border-radius: 8px;
    font-size: 13px;
    color: var(--text2);
    line-height: 1.6;
  }

  .explanation.show { display: block; }

  .expl-icon {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 4px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.05em;
  }

  .results-panel {
    display: none;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--card-r);
    padding: 40px 32px;
    text-align: center;
    margin-top: 40px;
  }

  .results-panel.show { display: block; }

  .results-score {
    font-family: 'Unbounded', sans-serif;
    font-size: 56px;
    font-weight: 700;
    line-height: 1;
    margin: 16px 0 8px;
  }

  .results-sub { color: var(--text2); font-size: 14px; margin-bottom: 28px; }

  .results-grade {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 20px;
    border-radius: 20px;
    margin-bottom: 28px;
  }

  .grade-a { background: rgba(62,207,142,0.15); color: var(--green); border: 1px solid rgba(62,207,142,0.3); }
  .grade-b { background: rgba(79,158,255,0.12); color: var(--accent); border: 1px solid rgba(79,158,255,0.3); }
  .grade-c { background: rgba(255,169,77,0.12); color: var(--amber); border: 1px solid rgba(255,169,77,0.3); }
  .grade-d { background: rgba(255,85,85,0.1); color: var(--red); border: 1px solid rgba(255,85,85,0.25); }

  .btn-reset {
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 28px;
    background: var(--accent);
    color: #0d0f14;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }

  .btn-reset:hover { opacity: 0.9; }
  .btn-reset:active { transform: scale(0.98); }

  .floating-score {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 12px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text2);
    display: none;
    z-index: 200;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  .floating-score span { color: var(--accent); font-weight: 700; }
  .floating-score.visible { display: block; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-tag">Рубежный контроль</div>
  <h1>NoSQL Базы данных</h1>
  <p class="hero-sub">50 вопросов по ключевым темам лекции. Кликай на вариант ответа — сразу узнаешь, правильно ли.</p>
  <div class="stats-bar">
    <div class="stat"><div class="stat-num">50</div><div class="stat-label">вопросов</div></div>
    <div class="stat"><div class="stat-num" id="answered-count">0</div><div class="stat-label">отвечено</div></div>
    <div class="stat"><div class="stat-num" id="correct-count">0</div><div class="stat-label">верных</div></div>
    <div class="stat"><div class="stat-num" id="pct-stat">0%</div><div class="stat-label">точность</div></div>
  </div>
</div>

<div class="progress-wrap">
  <div class="progress-meta">
    <span class="progress-label">Прогресс прохождения</span>
    <span class="progress-score" id="score-label">0 / 50</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
</div>

<div class="container" id="quiz-container"></div>

<div class="floating-score" id="floating-score">
  Верных: <span id="fs-score">0</span> / <span id="fs-answered">0</span>
</div>

<script>
const questions = [
  {
    section: "Реляционные БД и их ограничения",
    q: "Что такое 'impedance mismatch' в контексте реляционных БД?",
    opts: ["Несоответствие между скоростью записи и чтения", "Несоответствие между объектной моделью программы и реляционной моделью данных", "Ошибка при одновременном обращении нескольких пользователей", "Конфликт при горизонтальном масштабировании"],
    ans: 1,
    expl: "Impedance mismatch — это несоответствие между структурами объектов в коде (ООП) и строками в реляционных таблицах. Программисту приходится писать код преобразования, что создаёт лишнюю сложность."
  },
  {
    section: "Реляционные БД и их ограничения",
    q: "Почему вертикальное масштабирование реляционных БД имеет ограничения?",
    opts: ["Из-за проблем с SQL-запросами", "Физические пределы мощности одного сервера и высокая стоимость", "Нельзя создавать индексы на мощных серверах", "Реляционные БД не поддерживают транзакции на мощном железе"],
    ans: 1,
    expl: "Вертикальное масштабирование — добавление ресурсов к одному серверу. Оно имеет физический предел (нельзя бесконечно увеличивать CPU/RAM) и становится экспоненциально дорогим."
  },
  {
    section: "Реляционные БД и их ограничения",
    q: "Какой из перечисленных подходов является решением проблемы impedance mismatch, но без оптимизации запросов?",
    opts: ["Фрагментация данных", "ORM (объектно-реляционное отображение)", "Репликация ведущий-ведомый", "Одноранговая репликация"],
    ans: 1,
    expl: "ORM позволяет работать с БД в терминах объектов, но не оптимизирует запросы — это его главный минус. Разработчики часто получают неэффективные SQL-запросы."
  },
  {
    section: "История и особенности NoSQL",
    q: "В каком году и где произошёл семинар, с которого принято отсчитывать историю NoSQL?",
    opts: ["2005 г., Нью-Йорк", "2007 г., Лондон", "2009 г., Сан-Франциско", "2011 г., Берлин"],
    ans: 2,
    expl: "Термин NoSQL был популяризирован на семинаре в Сан-Франциско в 2009 году. Именно тогда началось активное распространение движения."
  },
  {
    section: "История и особенности NoSQL",
    q: "Какие две системы послужили главными прообразами NoSQL?",
    opts: ["MySQL и PostgreSQL", "BigTable (Google) и Dynamo (Amazon)", "Oracle и DB2", "MongoDB и Cassandra"],
    ans: 1,
    expl: "BigTable от Google и Dynamo от Amazon — системы, разработанные для обработки веб-масштабных данных, стали концептуальной основой для большинства NoSQL-баз."
  },
  {
    section: "История и особенности NoSQL",
    q: "Какое из утверждений об особенностях NoSQL НЕВЕРНО?",
    opts: ["NoSQL-базы не всегда имеют открытый исходный код", "Все NoSQL-базы обязательно работают в кластере", "Многие NoSQL-базы появились после 2000 года", "NoSQL-базы учитывают объёмы веб"],
    ans: 1,
    expl: "Не все NoSQL-базы работают на кластерах — это не обязательное условие. Например, графовые БД часто работают на одном сервере. Кластерная работа — частая, но не обязательная характеристика."
  },
  {
    section: "История и особенности NoSQL",
    q: "Что обычно подразумевают под 'гибкой структурой' в NoSQL?",
    opts: ["Возможность менять язык запросов", "Отсутствие фиксированной схемы данных", "Автоматическое масштабирование", "Встроенная поддержка транзакций"],
    ans: 1,
    expl: "Гибкая структура означает, что нет обязательной схемы (schema-free). Разные записи в одной коллекции могут иметь разный набор полей."
  },
  {
    section: "Агрегаты",
    q: "Что такое 'агрегат' в контексте NoSQL?",
    opts: ["SQL-функция для суммирования данных", "Единица хранения и обработки данных — коллекция связанных объектов как единое целое", "Индекс для ускорения поиска", "Копия данных на другом узле"],
    ans: 1,
    expl: "Агрегат — центральное понятие NoSQL. Это коллекция связанных объектов, которые хранятся и обрабатываются вместе. Например, заказ со всеми позициями и платёжными данными — один агрегат."
  },
  {
    section: "Агрегаты",
    q: "Кто определяет границы агрегата в NoSQL?",
    opts: ["СУБД автоматически", "Стандарт NoSQL", "Логика приложения", "Операционная система"],
    ans: 2,
    expl: "В NoSQL нет чётких правил определения агрегатов — их границы задаются исходя из того, как приложение работает с данными. Одни и те же данные можно агрегировать по-разному."
  },
  {
    section: "Агрегаты",
    q: "Что является минусом агрегатной модели?",
    opts: ["Плохая работа с кластерами", "Строгая фиксированная схема", "Трудности с ACID-транзакциями между несколькими агрегатами", "Отсутствие поддержки JSON"],
    ans: 2,
    expl: "ACID-транзакции (атомарность, согласованность, изолированность, долговечность) легко реализуются внутри одного агрегата, но при необходимости операции сразу над несколькими агрегатами возникают серьёзные трудности."
  },
  {
    section: "Хранилища ключ-значение",
    q: "По какому принципу организовано хранилище 'ключ-значение'?",
    opts: ["Иерархическое дерево документов", "Хэш-таблица с доступом по ключу", "Граф связей между объектами", "Строки и столбцы как в реляционной таблице"],
    ans: 1,
    expl: "Key-value хранилище — это по сути хэш-таблица. Каждому ключу соответствует одно значение. Доступ — только по ключу, СУБД не знает о внутренней структуре значения."
  },
  {
    section: "Хранилища ключ-значение",
    q: "Как хранилище ключ-значение относится к значению агрегата?",
    opts: ["Анализирует и индексирует внутреннюю структуру", "Воспринимает его как неделимый чёрный ящик", "Обязательно сохраняет в формате JSON", "Валидирует по схеме"],
    ans: 1,
    expl: "Для хранилища ключ-значение значение — это черный ящик (binary blob, XML, JSON). БД не знает о его внутренней структуре и не может по ней искать."
  },
  {
    section: "Хранилища ключ-значение",
    q: "Какое из применений НАИМЕНЕЕ подходит для хранилища ключ-значение?",
    opts: ["Хранение сессий пользователей", "Корзины заказов", "Сложные поисковые запросы по нескольким полям", "Кэширование данных"],
    ans: 2,
    expl: "Поиск по внутреннему содержимому значения в key-value хранилищах очень ограничен или недоступен — это принципиальное ограничение модели. Для сложного поиска нужны документные или реляционные БД."
  },
  {
    section: "Хранилища ключ-значение",
    q: "Какие базы данных относятся к классу ключ-значение?",
    opts: ["MongoDB, CouchDB, RavenDB", "Cassandra, HBase, HyperTable", "Riak, Redis, Memcached, Amazon DynamoDB", "Neo4j, OrientDB, InfiniteGraph"],
    ans: 2,
    expl: "Redis, Riak, Memcached, Berkeley DB, Amazon DynamoDB — классические представители key-value хранилищ. MongoDB и CouchDB — документные, Cassandra и HBase — колоночные, Neo4j — графовая."
  },
  {
    section: "Документные базы данных",
    q: "Чем документная БД принципиально отличается от хранилища ключ-значение?",
    opts: ["Использует SQL для запросов", "Понимает внутреннюю структуру документа и может по ней искать", "Хранит данные только в XML", "Не поддерживает уникальные идентификаторы"],
    ans: 1,
    expl: "Ключевое отличие: документная БД понимает структуру хранимого документа и позволяет строить запросы по любому полю внутри него. Key-value этого не умеет."
  },
  {
    section: "Документные базы данных",
    q: "Что заменяет NULL в документных базах данных?",
    opts: ["Специальный тип 'undefined'", "Пустая строка", "Отсутствие поля в документе", "Значение -1"],
    ans: 2,
    expl: "В документных БД вместо NULL просто отсутствует соответствующее поле. Это одно из проявлений гибкой схемы — документы могут иметь разный набор полей."
  },
  {
    section: "Документные базы данных",
    q: "В каком сценарии документные БД работают ХОРОШО?",
    opts: ["Многошаговые банковские транзакции", "Блоги и профили пользователей", "Частое изменение структуры агрегата", "Связанные данные с множеством JOIN"],
    ans: 1,
    expl: "Документные БД отлично подходят для блогов, профилей, событий, e-commerce — где структура данных вложенная, а транзакции простые (в рамках одного документа)."
  },
  {

    q: "Какую модель данных лучше использовать для рекомендательной системы 'похожие товары'?",
    opts: ["Ключ-значение", "Колоночная", "Графовая", "Реляционная"],
    ans: 2,
    expl: "Рекомендательные системы — классический кейс для графовых БД. Товары = узлы, связи = рёбра с весами. Запрос 'похожие товары' — обход графа от узла. Графовые алгоритмы (PageRank и т.д.) работают нативно."
  },
  {
    section: "Общие вопросы",
    q: "Вы строите систему аналитики в реальном времени для сайта. Данные приходят потоком, запросы — по временным диапазонам. Какой тип NoSQL подходит лучше?",
    opts: ["Ключ-значение (Redis)", "Документная (MongoDB)", "Колоночная (Cassandra)", "Графовая (Neo4j)"],
    ans: 2,
    expl: "Cassandra и HBase отлично подходят для временных рядов и потоковых данных. Ключ строки — идентификатор события, столбцы — атрибуты. Быстрое чтение по временным метками — их конёк."
  },
  {
    section: "Общие вопросы",
    q: "Разработчик хочет хранить данные пользователя: имя, список городов, массив адресов с разными полями в каждом. Какая модель наиболее естественна?",
    opts: ["Реляционная (несколько таблиц + JOIN)", "Ключ-значение", "Документная", "Колоночная"],
    ans: 2,
    expl: "Документная модель идеальна для вложенных, неоднородных структур. Пример из лекции: пользователь Vasia с массивом городов и пользователь Anna с массивом адресов — разная структура, одна коллекция."
  }
];

let answered = 0;
let correct = 0;

function buildQuiz() {
  const container = document.getElementById('quiz-container');
  const sections = {};
  questions.forEach((q, i) => {
    if (!sections[q.section]) sections[q.section] = [];
    sections[q.section].push({ ...q, idx: i });
  });

  Object.entries(sections).forEach(([sec, qs]) => {
    const lbl = document.createElement('div');
    lbl.className = 'section-label';
    lbl.innerHTML = `<span>${sec}</span>`;
    container.appendChild(lbl);

    qs.forEach(q => {
      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = `card-${q.idx}`;

      const letters = ['А', 'Б', 'В', 'Г'];
      const optsHtml = q.opts.map((o, oi) =>
        `<div class="option" data-qi="${q.idx}" data-oi="${oi}">
          <span class="opt-letter">${letters[oi]}</span>
          <span>${o}</span>
        </div>`
      ).join('');

      card.innerHTML = `
        <div class="q-header">
          <span class="q-num"># ${String(q.idx + 1).padStart(2,'0')}</span>
          <span class="q-text">${q.q}</span>
        </div>
        <div class="options">${optsHtml}</div>
        <div class="explanation" id="expl-${q.idx}">
          <div class="expl-icon">// объяснение</div>
          ${q.expl}
        </div>
      `;
      container.appendChild(card);
    });
  });

  const results = document.createElement('div');
  results.className = 'results-panel';
  results.id = 'results-panel';
  results.innerHTML = `
    <div style="font-size:13px;color:var(--text3);font-family:'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase">Тест завершён</div>
    <div class="results-score" id="res-score">0/50</div>
    <div class="results-sub" id="res-sub"></div>
    <div class="results-grade" id="res-grade"></div>
    <button class="btn-reset" onclick="resetQuiz()">Начать заново</button>
  `;
  container.appendChild(results);

  document.querySelectorAll('.option').forEach(opt => {
    opt.addEventListener('click', handleAnswer);
  });
}

function handleAnswer(e) {
  const opt = e.currentTarget;
  const qi = parseInt(opt.dataset.qi);
  const oi = parseInt(opt.dataset.oi);
  const card = document.getElementById(`card-${qi}`);

  if (card.classList.contains('answered-correct') || card.classList.contains('answered-wrong')) return;

  answered++;
  const isCorrect = oi === questions[qi].ans;
  if (isCorrect) correct++;

  const opts = card.querySelectorAll('.option');
  opts.forEach(o => {
    o.classList.add('disabled');
    const idx = parseInt(o.dataset.oi);
    if (idx === questions[qi].ans) o.classList.add(isCorrect && idx === oi ? 'correct' : 'reveal');
    else if (idx === oi && !isCorrect) o.classList.add('wrong');
  });

  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');
  document.getElementById(`expl-${qi}`).classList.add('show');

  updateStats();

  if (answered === questions.length) {
    setTimeout(showResults, 600);
  }
}

function updateStats() {
  document.getElementById('answered-count').textContent = answered;
  document.getElementById('correct-count').textContent = correct;
  const pct = answered > 0 ? Math.round(correct / answered * 100) : 0;
  document.getElementById('pct-stat').textContent = pct + '%';
  document.getElementById('score-label').textContent = `${answered} / ${questions.length}`;
  document.getElementById('progress-fill').style.width = (answered / questions.length * 100) + '%';

  const fs = document.getElementById('floating-score');
  if (answered > 0) {
    fs.classList.add('visible');
    document.getElementById('fs-score').textContent = correct;
    document.getElementById('fs-answered').textContent = answered;
  }
}

function showResults() {
  const panel = document.getElementById('results-panel');
  panel.classList.add('show');
  panel.scrollIntoView({ behavior: 'smooth', block: 'center' });

  const pct = Math.round(correct / questions.length * 100);
  document.getElementById('res-score').textContent = `${correct}/${questions.length}`;
  document.getElementById('res-sub').textContent = `Правильных ответов: ${correct} из ${questions.length} (${pct}%)`;

  const grade = document.getElementById('res-grade');
  if (pct >= 90) { grade.textContent = 'Отлично — можно идти на рубежный контроль!'; grade.className = 'results-grade grade-a'; }
  else if (pct >= 75) { grade.textContent = 'Хорошо — почти готов, повтори слабые темы'; grade.className = 'results-grade grade-b'; }
  else if (pct >= 55) { grade.textContent = 'Удовлетворительно — нужно повторить материал'; grade.className = 'results-grade grade-c'; }
  else { grade.textContent = 'Недостаточно — обязательно перечитай лекцию'; grade.className = 'results-grade grade-d'; }
}

function resetQuiz() {
  answered = 0; correct = 0;
  document.getElementById('quiz-container').innerHTML = '';
  document.getElementById('floating-score').classList.remove('visible');
  updateStats();
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuiz();
</script>
</body>
</html>
