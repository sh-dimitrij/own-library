<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест: XML, DTD, XPath, XQuery</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #141720;
    --surface2: #1c2030;
    --border: #2a3045;
    --accent: #4fffb0;
    --accent2: #ff6b6b;
    --accent3: #6baaff;
    --text: #e8eaf0;
    --muted: #6b7280;
    --correct: #22c55e;
    --wrong: #ef4444;
    --pending: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(79,255,176,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,255,176,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 48px;
    padding-bottom: 40px;
    border-bottom: 1px solid var(--border);
  }

  .header-tag {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 16px;
    border: 1px solid var(--accent);
    padding: 4px 12px;
    border-radius: 2px;
  }

  .header h1 {
    font-family: 'Unbounded', sans-serif;
    font-size: clamp(26px, 5vw, 42px);
    font-weight: 900;
    line-height: 1.1;
    color: var(--text);
    margin-bottom: 12px;
  }

  .header h1 span { color: var(--accent); }

  .header p {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
  }

  /* Progress Bar */
  .progress-wrap {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13,15,20,0.95);
    backdrop-filter: blur(12px);
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .progress-bar {
    height: 3px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* Section labels */
  .section-label {
    font-family: 'Unbounded', sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin: 48px 0 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Question card */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px;
    margin-bottom: 16px;
    transition: border-color 0.3s;
    animation: slideIn 0.3s ease both;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .question-card.answered-correct { border-color: var(--correct); }
  .question-card.answered-wrong { border-color: var(--wrong); }

  .question-num {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 12px;
  }

  .question-text {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text);
    margin-bottom: 20px;
    font-family: 'JetBrains Mono', monospace;
  }

  .question-text code {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 13px;
  }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 10px; }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 14px;
    line-height: 1.5;
    text-align: left;
    width: 100%;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
  }

  .option:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(79,255,176,0.05);
  }

  .option .opt-letter {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border: 1px solid var(--border);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--muted);
    font-weight: 700;
    letter-spacing: 0;
    transition: all 0.2s;
  }

  .option:disabled { cursor: default; }

  .option.selected-correct {
    border-color: var(--correct);
    background: rgba(34,197,94,0.08);
  }
  .option.selected-correct .opt-letter {
    background: var(--correct);
    border-color: var(--correct);
    color: #000;
  }

  .option.selected-wrong {
    border-color: var(--wrong);
    background: rgba(239,68,68,0.08);
  }
  .option.selected-wrong .opt-letter {
    background: var(--wrong);
    border-color: var(--wrong);
    color: #fff;
  }

  .option.reveal-correct {
    border-color: var(--correct);
    background: rgba(34,197,94,0.05);
  }
  .option.reveal-correct .opt-letter {
    border-color: var(--correct);
    color: var(--correct);
  }

  /* Explanation */
  .explanation {
    margin-top: 16px;
    padding: 14px 16px;
    background: rgba(107,170,255,0.07);
    border-left: 3px solid var(--accent3);
    border-radius: 4px;
    font-size: 13px;
    color: #a8c4ff;
    line-height: 1.7;
    display: none;
  }

  .explanation.show { display: block; animation: fadeIn 0.3s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Results */
  .results {
    display: none;
    text-align: center;
    padding: 60px 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-top: 40px;
  }

  .results.show { display: block; animation: slideIn 0.5s ease; }

  .score-ring {
    width: 140px;
    height: 140px;
    margin: 0 auto 28px;
    position: relative;
  }

  .score-ring svg {
    transform: rotate(-90deg);
    width: 100%;
    height: 100%;
  }

  .score-ring circle {
    fill: none;
    stroke-width: 8;
    stroke-linecap: round;
  }

  .score-ring .bg { stroke: var(--surface2); }
  .score-ring .fg { stroke: var(--accent); transition: stroke-dashoffset 1s ease; }

  .score-number {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .score-number span:first-child {
    font-family: 'Unbounded', sans-serif;
    font-size: 32px;
    font-weight: 900;
    color: var(--accent);
  }

  .score-number span:last-child {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .results h2 {
    font-family: 'Unbounded', sans-serif;
    font-size: 22px;
    margin-bottom: 12px;
  }

  .results p {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 24px;
  }

  .stats-row {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 32px;
  }

  .stat {
    text-align: center;
  }

  .stat-val {
    font-family: 'Unbounded', sans-serif;
    font-size: 24px;
    font-weight: 700;
  }

  .stat-val.green { color: var(--correct); }
  .stat-val.red { color: var(--wrong); }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-top: 4px;
  }

  .btn-retry {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 32px;
    background: var(--accent);
    color: #000;
    font-family: 'Unbounded', sans-serif;
    font-size: 13px;
    font-weight: 700;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .btn-retry:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(79,255,176,0.25);
  }

  /* Floating score counter */
  .floating-score {
    position: fixed;
    bottom: 28px;
    right: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 12px;
    z-index: 200;
    display: flex;
    gap: 16px;
  }

  .fs-item { text-align: center; }
  .fs-val { font-family: 'Unbounded', sans-serif; font-size: 18px; font-weight: 700; }
  .fs-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; }
  .fs-val.g { color: var(--correct); }
  .fs-val.r { color: var(--wrong); }

  @media (max-width: 600px) {
    .container { padding: 24px 16px 80px; }
    .question-card { padding: 20px 16px; }
    .floating-score { bottom: 16px; right: 16px; padding: 10px 14px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="header-tag">// самопроверка</div>
    <h1>XML · DTD · XPath · <span>XQuery</span></h1>
    <p>50 вопросов по теме «Полуструктурированные данные»<br>Выбери ответ — сразу увидишь пояснение</p>
  </div>

  <div class="progress-wrap">
    <div class="progress-info">
      <span id="prog-text">0 / 50 отвечено</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
  </div>

  <div id="quiz-container"></div>

  <div class="results" id="results">
    <div class="score-ring">
      <svg viewBox="0 0 120 120">
        <circle class="bg" cx="60" cy="60" r="52"/>
        <circle class="fg" id="score-arc" cx="60" cy="60" r="52"
          stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
      </svg>
      <div class="score-number">
        <span id="score-pct-text">0%</span>
        <span>РЕЗУЛЬТАТ</span>
      </div>
    </div>
    <h2 id="result-title">—</h2>
    <p id="result-desc">—</p>
    <div class="stats-row">
      <div class="stat"><div class="stat-val green" id="res-correct">0</div><div class="stat-label">ВЕРНО</div></div>
      <div class="stat"><div class="stat-val red" id="res-wrong">0</div><div class="stat-label">ОШИБОК</div></div>
      <div class="stat"><div class="stat-val" id="res-skip" style="color:var(--muted)">0</div><div class="stat-label">ПРОПУЩЕНО</div></div>
    </div>
    <button class="btn-retry" onclick="retryQuiz()">↺ &nbsp;Пройти снова</button>
  </div>
</div>

<div class="floating-score">
  <div class="fs-item"><div class="fs-val g" id="fs-c">0</div><div class="fs-label">ВЕРНО</div></div>
  <div class="fs-item"><div class="fs-val r" id="fs-w">0</div><div class="fs-label">ОШИБКИ</div></div>
</div>

<script>
const questions = [
  // ─── Полуструктурированные данные ───
  {
    section: "Полуструктурированные данные",
    q: "Какое из следующих утверждений НЕ является характеристикой полуструктурированных данных?",
    opts: ["Нет фиксированной схемы", "Данные хранят информацию о своей структуре", "Жёсткая схема, заданная заранее", "Схема может меняться со временем"],
    ans: 2,
    exp: "Жёсткая заранее заданная схема — это характеристика реляционных БД. Полуструктурированные данные, напротив, лишены фиксированной схемы."
  },
  {
    section: "Полуструктурированные данные",
    q: "Для чего используется модель полуструктурированных данных? (выберите наиболее полный ответ)",
    opts: ["Только для ускорения запросов", "Интеграция БД с различными схемами и представление документов", "Только для хранения чисел и дат", "Замена реляционных БД во всех случаях"],
    ans: 1,
    exp: "Два основных назначения: средство интеграции БД с различными схемами и представление документов в инструментальных системах."
  },
  {
    section: "Полуструктурированные данные",
    q: "Какой тип вершины в графе П/С данных содержит атомарные значения (строки, числа)?",
    opts: ["Корень", "Промежуточная вершина", "Лист", "Дуга"],
    ans: 2,
    exp: "Листья — это конечные вершины графа, содержащие атомарные значения: строки, числа. Например: 'Чапаев', '1934', '63'."
  },
  {
    section: "Полуструктурированные данные",
    q: "Граф полуструктурированных данных — это...",
    opts: ["Обязательно дерево (каждая вершина имеет ровно одного родителя)", "Не дерево: дуги могут вести к одной вершине из разных мест", "Ориентированный граф без циклов и кратных дуг", "Двудольный граф"],
    ans: 1,
    exp: "Граф П/С данных — НЕ дерево. В нём дуги могут вести к одной и той же вершине из разных мест (например, один актёр связан с несколькими фильмами)."
  },
  {
    section: "Полуструктурированные данные",
    q: "Что является меткой дуги в графе полуструктурированных данных?",
    opts: ["Числовой идентификатор вершины", "Тип объекта, название структуры или поля, связи объектов", "Цвет вершины", "Порядковый номер в базе данных"],
    ans: 1,
    exp: "Метки дуг задают: тип объекта/название структуры/название поля, а также связи между объектами. В XML эти метки становятся тегами."
  },
  {
    section: "Полуструктурированные данные",
    q: "Какое преимущество реляционных БД перед полуструктурированными данными?",
    opts: ["Гибкость схемы", "Описание произвольных документов", "Эффективность хранения и обработки данных", "Работа с унаследованными данными"],
    ans: 2,
    exp: "Реляционные БД выигрывают по эффективности хранения и обработки данных. Зато П/С данные гибче и лучше подходят для документов и legacy-систем."
  },
  {
    section: "Полуструктурированные данные",
    q: "Что представляет собой корень графа П/С данных?",
    opts: ["Один конкретный объект (например, один фильм)", "Вся база данных целиком", "Первая запись в таблице", "Атомарное значение наивысшего приоритета"],
    ans: 1,
    exp: "Корень — это вся БД целиком. От него ведут дуги ко всем типам объектов верхнего уровня (фильмы, актёры, студии)."
  },

  // ─── XML ───
  {
    section: "Язык XML",
    q: "Что такое XML?",
    opts: ["Язык программирования для серверных задач", "Расширяемый язык разметки, основанный на SGML", "Язык запросов к реляционным БД", "Формат двоичного хранения данных"],
    ans: 1,
    exp: "XML (Extensible Markup Language) — расширяемый язык разметки, основанный на языке SGML. Используется для представления данных в текстовом виде с помощью тегов."
  },
  {
    section: "Язык XML",
    q: "Как правильно записать пустой элемент в XML?",
    opts: ["<empty></empty>", "<empty/>", "<EMPTY>", "empty{}"],
    ans: 1,
    exp: "Пустой элемент (без содержимого) записывается с самозакрывающимся тегом: <bestbook/> или <dt year='2000'/>."
  },
  {
    section: "Язык XML",
    q: "Сколько корневых элементов может быть в XML-документе?",
    opts: ["Любое количество", "Не более двух", "Ровно один", "Ноль или один"],
    ans: 2,
    exp: "Корневой элемент обязателен и должен быть ровно один на весь документ. Он включает в себя все прочие элементы."
  },
  {
    section: "Язык XML",
    q: "Какой атрибут заголовка XML указывает кодировку документа?",
    opts: ["version", "standalone", "encoding", "charset"],
    ans: 2,
    exp: "Атрибут encoding задаёт кодировку: <?xml version='1.0' encoding='UTF-8' ?>. Часто используют UTF-8 или Windows-1251."
  },
  {
    section: "Язык XML",
    q: "Что означает атрибут standalone='yes' в заголовке XML?",
    opts: ["Документ имеет только один элемент", "Документ не требует внешних файлов (DTD)", "Документ написан на одном языке", "Версия XML — 1.0"],
    ans: 1,
    exp: "standalone='yes' означает самодостаточность: документ не требует дополнительных внешних файлов (например, внешнего DTD)."
  },
  {
    section: "Язык XML",
    q: "Как в XML записать знак «меньше» (<) внутри текстового содержимого?",
    opts: ["\\<", "&lt;", "<lt>", "<!--<-->"],
    ans: 1,
    exp: "Для служебных символов используют спецкоды: &lt; = <, &gt; = >, &amp; = &, &quot; = кавычка."
  },
  {
    section: "Язык XML",
    q: "Что произойдёт, если в XML использовать теги <Film> и <film>?",
    opts: ["Они будут считаться одинаковыми", "Они будут считаться разными тегами", "Документ станет невалидным", "Сработает предупреждение"],
    ans: 1,
    exp: "XML регистрозависим! <Film> и <film> — совершенно разные теги. Это важно помнить при составлении DTD и XPath-запросов."
  },
  {
    section: "Язык XML",
    q: "Как записать комментарий в XML?",
    opts: ["// комментарий", "/* комментарий */", "<!-- комментарий -->", "# комментарий"],
    ans: 2,
    exp: "Комментарии в XML записываются так: <!-- это комментарий -->. Как и в HTML."
  },
  {
    section: "Язык XML",
    q: "Какой тип XML-документа соответствует определению схемы и задаёт допустимые теги?",
    opts: ["Правильный (well-formed)", "Действительный (valid)", "Схематичный (schematic)", "Стандартный (standard)"],
    ans: 1,
    exp: "Действительный (valid) XML соответствует схеме (DTD или XSD), которая задаёт допустимые теги, атрибуты и вложенность. Правильный — лишь соответствует синтаксису XML."
  },
  {
    section: "Язык XML",
    q: "Как в XML кодируется связь между двумя объектами?",
    opts: ["Через вложенные теги", "Через атрибуты типа ID и IDREF/IDREFS", "Через комментарии", "Через DOCTYPE"],
    ans: 1,
    exp: "Связи кодируются через атрибуты: объект получает уникальный ID, а связанный с ним объект содержит IDREF — ссылку на этот ID."
  },
  {
    section: "Язык XML",
    q: "В примере из лекции атрибут toact='a1 a2' означает...",

let answered = 0;
let correct = 0;
let wrong = 0;

function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';

  let currentSection = '';
  let delay = 0;

  questions.forEach((q, i) => {
    if (q.section !== currentSection) {
      currentSection = q.section;
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = q.section;
      container.appendChild(label);
    }

    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `q${i}`;
    card.style.animationDelay = `${delay}ms`;
    delay = Math.min(delay + 30, 400);

    const letters = ['А', 'Б', 'В', 'Г'];

    const qText = q.q.replace(/<code>(.*?)<\/code>/g, '<code>$1</code>');

    card.innerHTML = `
      <div class="question-num">// вопрос ${String(i+1).padStart(2,'0')} из 50</div>
      <div class="question-text">${qText}</div>
      <div class="options" id="opts${i}">
        ${q.opts.map((opt, oi) => `
          <button class="option" onclick="answer(${i}, ${oi})" id="opt${i}_${oi}">
            <span class="opt-letter">${letters[oi]}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
      <div class="explanation" id="exp${i}">${q.exp}</div>
    `;

    container.appendChild(card);
  });
}

function answer(qIdx, optIdx) {
  const q = questions[qIdx];
  const card = document.getElementById(`q${qIdx}`);
  const exp = document.getElementById(`exp${qIdx}`);

  // Disable all options
  for (let i = 0; i < q.opts.length; i++) {
    const btn = document.getElementById(`opt${qIdx}_${i}`);
    btn.disabled = true;
    if (i === q.ans) btn.classList.add('reveal-correct');
  }

  const chosen = document.getElementById(`opt${qIdx}_${optIdx}`);

  if (optIdx === q.ans) {
    chosen.classList.add('selected-correct');
    card.classList.add('answered-correct');
    correct++;
    document.getElementById('fs-c').textContent = correct;
  } else {
    chosen.classList.add('selected-wrong');
    card.classList.add('answered-wrong');
    wrong++;
    document.getElementById('fs-w').textContent = wrong;
  }

  exp.classList.add('show');
  answered++;

  // Update progress
  const pct = Math.round(answered / 50 * 100);
  document.getElementById('prog-text').textContent = `${answered} / 50 отвечено`;
  document.getElementById('prog-pct').textContent = `${pct}%`;
  document.getElementById('prog-fill').style.width = pct + '%';

  if (answered === 50) {
    setTimeout(showResults, 600);
  }
}

function showResults() {
  const pct = Math.round(correct / 50 * 100);
  const skipped = 50 - answered;

  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-wrong').textContent = wrong;
  document.getElementById('res-skip').textContent = skipped;
  document.getElementById('score-pct-text').textContent = pct + '%';

  const circumference = 326.7;
  const offset = circumference - (pct / 100) * circumference;
  setTimeout(() => {
    document.getElementById('score-arc').style.strokeDashoffset = offset;
  }, 200);

  let title, desc;
  if (pct >= 90) { title = "Отлично! 🏆"; desc = "Превосходный результат. Тема освоена на высоком уровне."; }
  else if (pct >= 75) { title = "Хорошо! 👍"; desc = "Крепкие знания. Повтори вопросы, на которых ошибся."; }
  else if (pct >= 55) { title = "Неплохо"; desc = "Есть пробелы. Пересмотри шпаргалку и попробуй снова."; }
  else { title = "Нужно повторить"; desc = "Вернись к материалу лекции и шпаргалке, затем попробуй снова."; }

  document.getElementById('result-title').textContent = title;
  document.getElementById('result-desc').textContent = desc;

  const results = document.getElementById('results');
  results.classList.add('show');
  results.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function retryQuiz() {
  answered = 0; correct = 0; wrong = 0;
  document.getElementById('fs-c').textContent = 0;
  document.getElementById('fs-w').textContent = 0;
  document.getElementById('prog-text').textContent = '0 / 50 отвечено';
  document.getElementById('prog-pct').textContent = '0%';
  document.getElementById('prog-fill').style.width = '0%';
  document.getElementById('results').classList.remove('show');
  document.getElementById('score-arc').style.strokeDashoffset = '326.7';
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuiz();
</script>
</body>
</html>
