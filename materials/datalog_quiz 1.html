<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datalog — Тест для самопроверки</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Unbounded:wght@400;700;900&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --bg2: #0f1525;
    --bg3: #161d30;
    --surface: #1a2238;
    --surface2: #212d44;
    --accent: #4f9cf9;
    --accent2: #7c6af7;
    --accent3: #f9784f;
    --green: #3ecf8e;
    --red: #f55858;
    --text: #e8edf8;
    --text2: #8b9dc3;
    --text3: #4a5a7a;
    --border: rgba(79,156,249,0.15);
    --glow: rgba(79,156,249,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Onest', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(79,156,249,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,156,249,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(124,106,247,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    animation: floatOrb 12s ease-in-out infinite alternate;
  }

  @keyframes floatOrb {
    0% { transform: translate(0,0); }
    100% { transform: translate(300px, 200px); }
  }

  .orb2 {
    position: fixed;
    bottom: -100px; right: -100px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(79,156,249,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    animation: floatOrb2 15s ease-in-out infinite alternate;
  }

  @keyframes floatOrb2 {
    0% { transform: translate(0,0); }
    100% { transform: translate(-250px, -150px); }
  }

  /* Header */
  header {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 60px 20px 40px;
  }

  .badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 24px;
    background: rgba(79,156,249,0.06);
  }

  h1 {
    font-family: 'Unbounded', sans-serif;
    font-size: clamp(28px, 5vw, 52px);
    font-weight: 900;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 0%, var(--accent) 50%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
  }

  .subtitle {
    color: var(--text2);
    font-size: 16px;
    font-weight: 300;
    max-width: 500px;
    margin: 0 auto 40px;
    line-height: 1.6;
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 50px;
    position: relative;
    z-index: 10;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 28px;
    text-align: center;
    min-width: 120px;
    transition: border-color 0.3s, transform 0.3s;
  }

  .stat-card:hover { border-color: var(--accent); transform: translateY(-2px); }

  .stat-num {
    font-family: 'Unbounded', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    display: block;
  }

  .stat-label {
    font-size: 12px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 500;
  }

  /* Progress */
  .progress-wrap {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,14,26,0.9);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .progress-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text2);
    white-space: nowrap;
  }

  .progress-bar {
    flex: 1;
    height: 6px;
    background: var(--surface2);
    border-radius: 10px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 10px;
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    width: 0%;
  }

  .score-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--green);
    white-space: nowrap;
    min-width: 80px;
    text-align: right;
  }

  /* Main layout */
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 40px 20px 80px;
    position: relative;
    z-index: 10;
  }

  /* Category header */
  .category-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 48px 0 24px;
  }

  .category-header:first-child { margin-top: 0; }

  .cat-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .cat-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .cat-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border), transparent);
  }

  /* Question card */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 16px;
    transition: border-color 0.3s, box-shadow 0.3s, transform 0.2s;
    position: relative;
    overflow: hidden;
    animation: cardIn 0.4s ease both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    opacity: 0;
    transition: opacity 0.3s;
  }

  .question-card:hover::before { opacity: 1; }
  .question-card:hover { border-color: rgba(79,156,249,0.3); box-shadow: 0 8px 40px rgba(79,156,249,0.06); }

  .question-card.answered-correct {
    border-color: rgba(62,207,142,0.4);
    background: rgba(62,207,142,0.04);
  }

  .question-card.answered-correct::before {
    background: linear-gradient(90deg, var(--green), #2ecc71);
    opacity: 1;
  }

  .question-card.answered-wrong {
    border-color: rgba(245,88,88,0.4);
    background: rgba(245,88,88,0.04);
  }

  .question-card.answered-wrong::before {
    background: linear-gradient(90deg, var(--red), #e74c3c);
    opacity: 1;
  }

  .q-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  .q-text {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 20px;
  }

  .q-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 12px 0 16px;
    color: #7dd3fc;
    line-height: 1.7;
    white-space: pre;
    overflow-x: auto;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: all 0.2s;
    font-size: 15px;
    color: var(--text2);
    text-align: left;
    width: 100%;
    font-family: 'Onest', sans-serif;
  }

  .option:hover:not(:disabled) {
    background: var(--surface2);
    border-color: var(--accent);
    color: var(--text);
    transform: translateX(4px);
  }

  .option:disabled { cursor: default; }

  .opt-letter {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    transition: all 0.2s;
    color: var(--text2);
  }

  .option.correct {
    background: rgba(62,207,142,0.1);
    border-color: var(--green);
    color: var(--green);
    transform: translateX(4px);
  }

  .option.correct .opt-letter {
    background: var(--green);
    color: #000;
    border-color: var(--green);
  }

  .option.wrong {
    background: rgba(245,88,88,0.08);
    border-color: var(--red);
    color: var(--red);
  }

  .option.wrong .opt-letter {
    background: var(--red);
    color: #fff;
    border-color: var(--red);
  }

  .option.dimmed { opacity: 0.35; }

  /* Explanation */
  .explanation {
    margin-top: 16px;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    display: none;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .explanation.correct-exp {
    background: rgba(62,207,142,0.08);
    border: 1px solid rgba(62,207,142,0.3);
    color: #7ef0be;
    display: block;
  }

  .explanation.wrong-exp {
    background: rgba(249,120,79,0.08);
    border: 1px solid rgba(249,120,79,0.3);
    color: #fbb89a;
    display: block;
  }

  .exp-icon { margin-right: 8px; }

  /* Results panel */
  #results-panel {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(10,14,26,0.97);
    backdrop-filter: blur(30px);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 40px 20px;
  }

  #results-panel.show { display: flex; animation: fadeIn 0.5s ease; }

  .result-emoji { font-size: 80px; margin-bottom: 24px; }

  .result-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 36px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--green), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
  }

  .result-score {
    font-family: 'JetBrains Mono', monospace;
    font-size: 64px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .result-sub {
    color: var(--text2);
    font-size: 18px;
    margin-bottom: 40px;
  }

  .result-grade {
    font-family: 'Unbounded', sans-serif;
    font-size: 16px;
    padding: 14px 32px;
    border-radius: 50px;
    margin-bottom: 32px;
    font-weight: 700;
  }

  .grade-5 { background: rgba(62,207,142,0.15); color: var(--green); border: 2px solid var(--green); }
  .grade-4 { background: rgba(79,156,249,0.15); color: var(--accent); border: 2px solid var(--accent); }
  .grade-3 { background: rgba(249,120,79,0.15); color: var(--accent3); border: 2px solid var(--accent3); }
  .grade-2 { background: rgba(245,88,88,0.15); color: var(--red); border: 2px solid var(--red); }

  .btn-restart {
    font-family: 'Unbounded', sans-serif;
    font-size: 14px;
    font-weight: 700;
    padding: 16px 40px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .btn-restart:hover {
    transform: scale(1.04);
    box-shadow: 0 0 40px rgba(79,156,249,0.4);
  }

  /* Finish button */
  .finish-wrap {
    text-align: center;
    margin-top: 48px;
    position: relative;
    z-index: 10;
  }

  .btn-finish {
    font-family: 'Unbounded', sans-serif;
    font-size: 15px;
    font-weight: 700;
    padding: 18px 52px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 30px rgba(79,156,249,0.25);
  }

  .btn-finish:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 8px 40px rgba(79,156,249,0.4);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

  @media (max-width: 600px) {
    .question-card { padding: 20px 16px; }
    .q-text { font-size: 15px; }
    .option { font-size: 14px; padding: 11px 14px; }
  }
</style>
</head>
<body>
<div class="orb2"></div>

<header>
  <div class="badge">Постреляционные БД · Лекция №5</div>
  <h1>Тест по Datalog</h1>
  <p class="subtitle">50 вопросов для подготовки к рубежному контролю. Проверь свои знания!</p>
</header>

<div class="stats-bar">
  <div class="stat-card">
    <span class="stat-num">50</span>
    <span class="stat-label">Вопросов</span>
  </div>
  <div class="stat-card">
    <span class="stat-num" id="answered-count">0</span>
    <span class="stat-label">Отвечено</span>
  </div>
  <div class="stat-card">
    <span class="stat-num" id="correct-count" style="color:var(--green)">0</span>
    <span class="stat-label">Верно</span>
  </div>
  <div class="stat-card">
    <span class="stat-num" id="wrong-count" style="color:var(--red)">0</span>
    <span class="stat-label">Неверно</span>
  </div>
</div>

<div class="progress-wrap">
  <span class="progress-label" id="progress-label">0 / 50</span>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <span class="score-display" id="score-display">0%</span>
</div>

<main id="quiz-main"></main>

<div class="finish-wrap" style="position:relative;z-index:10;padding-bottom:60px">
  <button class="btn-finish" onclick="showResults()">Завершить тест →</button>
</div>

<div id="results-panel">
  <div class="result-emoji" id="result-emoji">🎓</div>
  <div class="result-title" id="result-title">Результат</div>
  <div class="result-score" id="result-score">0/50</div>
  <div class="result-sub" id="result-sub">правильных ответов</div>
  <div class="result-grade" id="result-grade"></div>
  <button class="btn-restart" onclick="restart()">↺ Пройти ещё раз</button>
</div>

<script>
const questions = [
  // === БЛОК 1: ОСНОВЫ И ПРЕДИКАТЫ ===
  {
    cat: "🧠 Основы и предикаты",
    catColor: "#4f9cf9",
    catBg: "rgba(79,156,249,0.15)",
    q: "Что означает аббревиатура «Datalog»?",
    opts: ["Data + Algorithm", "Database Logic", "Data Language", "Declarative Logic"],
    a: 1,
    exp: "Datalog расшифровывается как Database Logic — «Логика баз данных». Это логический язык запросов к реляционным БД."
  },
  {
    q: "Что такое предикат в языке Datalog?",
    opts: [
      "Переменная с заданным типом данных",
      "Функция с фиксированным числом аргументов, возвращающая TRUE или FALSE",
      "Таблица в реляционной БД",
      "Оператор сравнения двух значений"
    ],
    a: 1,
    exp: "Предикат — аналог функции, обладающий фиксированным количеством аргументов и возвращающий TRUE или FALSE."
  },
  {
    q: "Как называется предикат с конкретными аргументами?",
    opts: ["Правило", "Подцель", "Атом", "Кортеж"],
    a: 2,
    exp: "Предикат с аргументами называется атомом. Например, P(x1, x2) — это атом предиката P с аргументами x1 и x2."
  },
  {
    q: "Аргументами предиката в Datalog могут быть:",
    opts: [
      "Только константы (числа и строки)",
      "Только переменные",
      "Константы и переменные",
      "Предикаты других таблиц"
    ],
    a: 2,
    exp: "Аргументы предиката бывают двух видов: константы (конкретные значения) и переменные (неизвестные значения)."
  },
  {
    q: "Дана таблица R: {(1,2), (3,4)}. Каким будет значение атома R(4,7)?",
    opts: ["TRUE", "FALSE", "NULL", "Ошибка вычисления"],
    a: 1,
    exp: "Реляционный атом R(4,7) вернёт FALSE, так как кортежа (4,7) нет в отношении R. Атом возвращает TRUE только если список значений является кортежем данного отношения."
  },
  {
    q: "Чем реляционный атом отличается от арифметического?",
    opts: [
      "Реляционный конечен и изменяем, арифметический — бесконечен и неизменен",
      "Реляционный бесконечен и неизменен, арифметический — конечен и изменяем",
      "Реляционный использует переменные, арифметический — нет",
      "Они ничем не отличаются"
    ],
    a: 0,
    exp: "Реляционные атомы конечны (зависят от данных в таблице) и изменяемы со временем. Арифметические атомы описывают бесконечное и неизменное множество (например, все x < 5)."
  },
  {
    q: "Какой из следующих записей является арифметическим атомом?",
    opts: ["Person(name, age)", "Фильм(н, г, _, _, ст)", "(x + 1) <= (y + 4*z)", "Path(от, до)"],
    a: 2,
    exp: "Арифметический атом — это сравнение двух арифметических выражений, например (x+1) <= (y+4*z). Остальные варианты — реляционные атомы."
  },
  {
    q: "Какой оператор используется для обозначения «не равно» в арифметических атомах Datalog?",
    opts: ["!=", "NOT =", "<>", "≠"],
    a: 2,
    exp: "В Datalog для обозначения «не равно» используется оператор <>. Это стандартный оператор, применяемый в арифметических подцелях."
  },

  // === БЛОК 2: ПРАВИЛА ===
  {
    cat: "📋 Правила и синтаксис",
    catColor: "#7c6af7",
    catBg: "rgba(124,106,247,0.15)",
    q: "Какой синтаксис используется для записи правила в Datalog?",
    opts: ["Тело → Заголовок", "Заголовок <– тело", "IF тело THEN заголовок", "SELECT заголовок FROM тело"],
    a: 1,
    exp: "Правило в Datalog записывается как: Заголовок <– тело. Читается как «заголовок истинен, если тело истинно»."
  },
  {
    q: "Как называются атомы, входящие в тело правила?",
    opts: ["Результаты", "Подцели", "Аргументы", "Ключи"],
    a: 1,
    exp: "Атомы в теле правила называются подцелями. Подцели объединяются оператором AND, перед каждой может стоять оператор NOT."
  },
  {
    q: "Что означает знак «_» в правиле Datalog?",
    opts: [
      "Пустое значение (NULL)",
      "Обязательный параметр",
      "Анонимная переменная — встречается однократно и не важна по имени",
      "Разделитель аргументов"
    ],
    a: 2,
    exp: "Знак подчёркивания _ — это анонимная переменная. Используется, когда переменная упоминается однократно и её имя не имеет смысла."

let answered = 0, correct = 0, wrong = 0;
let answeredMap = {};
let catCache = {};

function buildQuiz() {
  const main = document.getElementById('quiz-main');
  main.innerHTML = '';
  let lastCat = null;
  questions.forEach((q, i) => {
    const cat = q.cat || lastCat;
    if (q.cat && q.cat !== lastCat) {
      lastCat = q.cat;
      if (!catCache[cat]) catCache[cat] = q;
      const catDiv = document.createElement('div');
      catDiv.className = 'category-header';
      catDiv.innerHTML = `
        <div class="cat-icon" style="background:${q.catBg || 'rgba(79,156,249,0.15)'}">
          ${cat.split(' ')[0]}
        </div>
        <span class="cat-title" style="color:${q.catColor || 'var(--accent)'}">${cat.split(' ').slice(1).join(' ')}</span>
        <div class="cat-line" style="background:linear-gradient(90deg,${q.catColor || 'var(--accent)'}33,transparent)"></div>
      `;
      main.appendChild(catDiv);
    }

    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `card-${i}`;
    card.style.animationDelay = `${(i % 10) * 0.04}s`;

    const qText = q.q.includes('\n')
      ? q.q.split('\n').map((line, idx) => idx === 0 ? line : `<div class="q-code">${line}</div>`).join('')
      : q.q;

    card.innerHTML = `
      <div class="q-number">Вопрос ${i + 1} из ${questions.length}</div>
      <div class="q-text">${qText}</div>
      <div class="options" id="opts-${i}">
        ${q.opts.map((opt, j) => `
          <button class="option" onclick="answer(${i}, ${j})" id="opt-${i}-${j}">
            <span class="opt-letter">${String.fromCharCode(65 + j)}</span>
            ${opt.includes('\n') ? opt.replace(/\n/g, '<br>') : opt}
          </button>
        `).join('')}
      </div>
      <div class="explanation" id="exp-${i}"></div>
    `;
    main.appendChild(card);
  });
}

function answer(qIdx, optIdx) {
  if (answeredMap[qIdx] !== undefined) return;
  answeredMap[qIdx] = optIdx;

  const q = questions[qIdx];
  const card = document.getElementById(`card-${qIdx}`);
  const exp = document.getElementById(`exp-${qIdx}`);
  const isCorrect = optIdx === q.a;

  for (let j = 0; j < q.opts.length; j++) {
    const btn = document.getElementById(`opt-${qIdx}-${j}`);
    btn.disabled = true;
    if (j === q.a) btn.classList.add('correct');
    else if (j === optIdx && !isCorrect) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  }

  if (isCorrect) {
    correct++;
    card.classList.add('answered-correct');
    exp.className = 'explanation correct-exp';
    exp.innerHTML = `<span class="exp-icon">✅</span>${q.exp}`;
    document.getElementById('correct-count').textContent = correct;
  } else {
    wrong++;
    card.classList.add('answered-wrong');
    exp.className = 'explanation wrong-exp';
    exp.innerHTML = `<span class="exp-icon">💡</span>${q.exp}`;
    document.getElementById('wrong-count').textContent = wrong;
  }

  answered++;
  document.getElementById('answered-count').textContent = answered;
  updateProgress();
}

function updateProgress() {
  const pct = Math.round((answered / questions.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${answered} / ${questions.length}`;
  const scorePct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  document.getElementById('score-display').textContent = scorePct + '%';
}

function showResults() {
  const panel = document.getElementById('results-panel');
  const pct = Math.round((correct / questions.length) * 100);

  document.getElementById('result-score').textContent = `${correct}/${questions.length}`;
  document.getElementById('result-sub').textContent = `правильных ответов — ${pct}%`;

  let emoji, title, gradeText, gradeClass;
  if (pct >= 90) { emoji = '🏆'; title = 'Отлично!'; gradeText = 'Оценка: 5 — Отлично'; gradeClass = 'grade-5'; }
  else if (pct >= 75) { emoji = '🎯'; title = 'Хорошо!'; gradeText = 'Оценка: 4 — Хорошо'; gradeClass = 'grade-4'; }
  else if (pct >= 60) { emoji = '📚'; title = 'Удовлетворительно'; gradeText = 'Оценка: 3 — Повтори материал'; gradeClass = 'grade-3'; }
  else { emoji = '😓'; title = 'Нужно повторить!'; gradeText = 'Оценка: 2 — Вернись к лекции'; gradeClass = 'grade-2'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;
  const g = document.getElementById('result-grade');
  g.textContent = gradeText;
  g.className = `result-grade ${gradeClass}`;

  panel.classList.add('show');
}

function restart() {
  answered = 0; correct = 0; wrong = 0; answeredMap = {};
  document.getElementById('results-panel').classList.remove('show');
  document.getElementById('answered-count').textContent = 0;
  document.getElementById('correct-count').textContent = 0;
  document.getElementById('wrong-count').textContent = 0;
  updateProgress();
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuiz();
</script>
