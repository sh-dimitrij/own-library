<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cassandra — Тест для самопроверки</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e1a;
    --surface: #111525;
    --surface2: #161b30;
    --border: #1e2640;
    --accent: #4f8ef7;
    --accent2: #7c3aed;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --text: #e2e8f0;
    --muted: #64748b;
    --tag: #1e3a5f;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* GRID BACKGROUND */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(79,142,247,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,142,247,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* GLOW ORBS */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    z-index: 0;
    opacity: 0.18;
  }
  .orb1 { width: 600px; height: 600px; background: #4f8ef7; top: -200px; left: -200px; }
  .orb2 { width: 500px; height: 500px; background: #7c3aed; bottom: -200px; right: -200px; }

  /* LAYOUT */
  .wrapper { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 40px 20px 80px; }

  /* HEADER */
  header {
    text-align: center;
    margin-bottom: 60px;
    padding: 60px 40px;
    background: linear-gradient(135deg, rgba(79,142,247,0.07), rgba(124,58,237,0.07));
    border: 1px solid var(--border);
    border-radius: 24px;
    position: relative;
    overflow: hidden;
  }
  header::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
  }
  .header-tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    background: rgba(79,142,247,0.1);
    border: 1px solid rgba(79,142,247,0.25);
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 20px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  h1 {
    font-family: 'Dela Gothic One', sans-serif;
    font-size: clamp(28px, 5vw, 48px);
    background: linear-gradient(135deg, #e2e8f0, #4f8ef7, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.15;
    margin-bottom: 16px;
  }
  .header-sub {
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
  }

  /* STATS BAR */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 40px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    transition: border-color 0.3s;
  }
  .stat-card:hover { border-color: var(--accent); }
  .stat-num {
    font-family: 'Dela Gothic One', sans-serif;
    font-size: 28px;
    color: var(--accent);
    display: block;
  }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

  /* PROGRESS */
  .progress-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 24px;
    margin-bottom: 40px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .progress-label { font-size: 13px; color: var(--muted); white-space: nowrap; min-width: 80px; }
  .progress-track {
    flex: 1;
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 4px;
    width: 0%;
    transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .progress-pct { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--accent); min-width: 36px; text-align: right; }

  /* CATEGORIES */
  .category-label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    margin-top: 48px;
  }
  .cat-icon { font-size: 20px; }
  .cat-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--accent);
  }
  .cat-line { flex: 1; height: 1px; background: var(--border); }

  /* QUESTION CARD */
  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    margin-bottom: 16px;
    overflow: hidden;
    transition: border-color 0.3s, box-shadow 0.3s;
    animation: slideIn 0.4s ease both;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .q-card:hover { border-color: rgba(79,142,247,0.3); box-shadow: 0 0 30px rgba(79,142,247,0.05); }
  .q-card.answered-correct { border-color: var(--green); box-shadow: 0 0 20px rgba(34,197,94,0.1); }
  .q-card.answered-wrong { border-color: var(--red); box-shadow: 0 0 20px rgba(239,68,68,0.1); }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 22px 24px;
    cursor: pointer;
    user-select: none;
  }
  .q-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 8px;
    min-width: 36px;
    text-align: center;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .q-text { font-weight: 600; font-size: 15px; flex: 1; line-height: 1.5; }
  .q-badge {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }
  .badge-easy { background: rgba(34,197,94,0.15); color: var(--green); }
  .badge-med { background: rgba(245,158,11,0.15); color: var(--yellow); }
  .badge-hard { background: rgba(239,68,68,0.15); color: var(--red); }

  /* OPTIONS */
  .q-options {
    padding: 0 24px 20px;
    display: grid;
    gap: 8px;
  }
  .opt {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--surface2);
    font-size: 14px;
  }
  .opt:hover { border-color: var(--accent); background: rgba(79,142,247,0.05); transform: translateX(3px); }
  .opt.correct { border-color: var(--green); background: rgba(34,197,94,0.08); color: #86efac; }
  .opt.wrong { border-color: var(--red); background: rgba(239,68,68,0.08); color: #fca5a5; }
  .opt.revealed-correct { border-color: var(--green); background: rgba(34,197,94,0.05); }
  .opt-letter {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    background: var(--border);
    border-radius: 6px;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .opt.correct .opt-letter { background: var(--green); color: #000; }
  .opt.wrong .opt-letter { background: var(--red); color: #fff; }
  .opt.revealed-correct .opt-letter { background: rgba(34,197,94,0.3); color: var(--green); }

  /* EXPLANATION */
  .explanation {
    margin: 0 24px 20px;
    padding: 14px 16px;
    background: rgba(79,142,247,0.06);
    border: 1px solid rgba(79,142,247,0.2);
    border-radius: 10px;
    font-size: 13px;
    color: #94b8f5;
    display: none;
    line-height: 1.6;
  }
  .explanation.show { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .explanation strong { color: var(--accent); }

  /* CODE INLINE */
  code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    background: rgba(79,142,247,0.12);
    color: #93c5fd;
    padding: 1px 6px;
    border-radius: 4px;
  }

  /* RESULTS PANEL */
  .results-panel {
    display: none;
    margin-top: 40px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .results-panel::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(79,142,247,0.05), rgba(124,58,237,0.05));
  }
  .results-panel.show { display: block; animation: slideIn 0.5s ease; }
  .results-score {
    font-family: 'Dela Gothic One', sans-serif;
    font-size: 72px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin: 16px 0;
    position: relative;
  }
  .results-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; position: relative; }
  .results-msg { color: var(--muted); font-size: 14px; margin-bottom: 32px; position: relative; }
  .results-breakdown {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 32px;
    position: relative;
  }
  .res-item {
    padding: 16px;
    border-radius: 14px;
    border: 1px solid var(--border);
  }
  .res-item.c { border-color: rgba(34,197,94,0.3); background: rgba(34,197,94,0.05); }
  .res-item.w { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
  .res-item.s { border-color: rgba(79,142,247,0.3); background: rgba(79,142,247,0.05); }
  .res-num { font-family: 'Dela Gothic One', sans-serif; font-size: 36px; display: block; }
  .c .res-num { color: var(--green); }
  .w .res-num { color: var(--red); }
  .s .res-num { color: var(--accent); }
  .res-lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

  /* BUTTONS */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    border-radius: 12px;
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    box-shadow: 0 4px 20px rgba(79,142,247,0.3);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(79,142,247,0.4); }
  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); }

  .actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 40px; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  @media (max-width: 600px) {
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
    .results-breakdown { grid-template-columns: 1fr; }
    header { padding: 40px 20px; }
  }
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="wrapper">

  <header>
    <div class="header-tag">♦ Постреляционные БД · Лекция №3</div>
    <h1>Apache Cassandra<br>Тест для самопроверки</h1>
    <p class="header-sub">50 вопросов · Модель данных · CQL · Репликация · Согласованность</p>
  </header>

  <div class="stats-bar">
    <div class="stat-card">
      <span class="stat-num" id="s-total">50</span>
      <span class="stat-label">Вопросов</span>
    </div>
    <div class="stat-card">
      <span class="stat-num" id="s-answered" style="color:var(--yellow)">0</span>
      <span class="stat-label">Отвечено</span>
    </div>
    <div class="stat-card">
      <span class="stat-num" id="s-correct" style="color:var(--green)">0</span>
      <span class="stat-label">Верно</span>
    </div>
    <div class="stat-card">
      <span class="stat-num" id="s-wrong" style="color:var(--red)">0</span>
      <span class="stat-label">Неверно</span>
    </div>
  </div>

  <div class="progress-wrap">
    <span class="progress-label">Прогресс</span>
    <div class="progress-track"><div class="progress-fill" id="prog-fill"></div></div>
    <span class="progress-pct" id="prog-pct">0%</span>
  </div>

  <div id="quiz-container"></div>

  <div class="actions">
    <button class="btn btn-primary" onclick="checkResults()">📊 Посмотреть результат</button>
    <button class="btn btn-secondary" onclick="resetQuiz()">↺ Сбросить всё</button>
  </div>

  <div class="results-panel" id="results">
    <div class="results-title" id="res-title">Результат теста</div>
    <div class="results-score" id="res-score">0%</div>
    <div class="results-msg" id="res-msg"></div>
    <div class="results-breakdown">
      <div class="res-item c"><span class="res-num" id="rb-c">0</span><span class="res-lbl">✓ Верно</span></div>
      <div class="res-item w"><span class="res-num" id="rb-w">0</span><span class="res-lbl">✗ Неверно</span></div>
      <div class="res-item s"><span class="res-num" id="rb-s">0</span><span class="res-lbl">◎ Пропущено</span></div>
    </div>
  </div>

</div>

<script>
const questions = [
  // ─── КАТЕГОРИЯ 1: Основы и терминология ───
  {
    cat: "🗂 Основы и терминология",
    q: "Что является аналогом «базы данных» (schema) в Cassandra?",
    opts: ["Семейство столбцов", "Пространство ключей (Keyspace)", "Кластер", "Строка"],
    ans: 1,
    diff: "easy",
    exp: "<strong>Пространство ключей (Keyspace)</strong> — это аналог базы данных или схемы в реляционных СУБД. Оно содержит семейства столбцов и настройки репликации."
  },
  {
    q: "Что является аналогом «таблицы» в Cassandra?",
    opts: ["Строка (Row)", "Столбец (Column)", "Семейство столбцов (Column Family)", "Пространство ключей (Keyspace)"],
    ans: 2,
    diff: "easy",
    exp: "<strong>Семейство столбцов (Column Family)</strong> — аналог таблицы. Его ключевое отличие от таблицы SQL в том, что разные строки могут иметь разный набор столбцов."
  },
  {
    q: "Что является аналогом «сервера БД» в Cassandra?",
    opts: ["Узел (Node)", "Кластер (Cluster)", "Координатор", "Пространство ключей"],
    ans: 1,
    diff: "easy",
    exp: "<strong>Кластер</strong> — аналог сервера БД. Cassandra работает как распределённый кластер из нескольких узлов."
  },
  {
    q: "Из каких трёх компонентов состоит базовый элемент (столбец) в Cassandra?",
    opts: ["Ключ, значение, тип", "Имя, значение, метка времени (timestamp)", "ID, значение, индекс", "Ключ строки, имя, данные"],
    ans: 1,
    diff: "easy",
    exp: "Столбец в Cassandra — это тройка: <strong>name</strong> (имя), <strong>value</strong> (значение), <strong>timestamp</strong> (метка времени). Timestamp нужен для разрешения конфликтов при репликации."
  },
  {
    q: "Какие СУБД относятся к колоночным базам данных? (выберите наиболее полный ответ)",
    opts: ["MySQL, PostgreSQL, SQLite", "MongoDB, Redis, Neo4j", "Cassandra, HBase, Amazon DynamoDB", "Kafka, RabbitMQ, Redis"],
    ans: 2,
    diff: "easy",
    exp: "<strong>Cassandra, HBase, Amazon SimpleDB, Amazon DynamoDB, HyperTable</strong> — всё это колоночные (широкостолбцовые) базы данных. MySQL/PostgreSQL — реляционные, MongoDB — документная, Redis — ключ-значение."
  },
  {
    q: "Для чего нужна метка времени (timestamp) в столбце Cassandra?",
    opts: ["Для сортировки данных при выводе", "Для разрешения конфликтов при репликации, обновлении и удалении", "Для ограничения времени жизни (TTL)", "Для индексирования данных"],
    ans: 1,
    diff: "med",
    exp: "<strong>Timestamp</strong> используется для разрешения конфликтов: если два узла имеют разные значения одного столбца, побеждает запись с <em>большим</em> timestamp (более поздняя). Также участвует в процессах обновления и удаления."
  },
  {
    q: "Что такое суперстолбец (Super Column) в Cassandra?",
    opts: ["Столбец с очень большим значением", "Столбец, значением которого является ассоциативный массив других столбцов", "Индексированный столбец", "Первичный ключ таблицы"],
    ans: 1,
    diff: "med",
    exp: "<strong>Суперстолбец</strong> — это столбец, значением которого является не простое значение, а <em>словарь (ассоциативный массив) других столбцов</em>. Например, суперстолбец «bookA» может содержать author, izd, isbn."
  },
  {
    q: "Могут ли разные строки в одном семействе столбцов иметь разный набор столбцов?",
    opts: ["Нет, все строки должны иметь одинаковую структуру", "Да, каждая строка может иметь свой уникальный набор столбцов", "Только если создан специальный флаг при создании таблицы", "Только для суперстолбцов"],
    ans: 1,
    diff: "easy",
    exp: "Это одно из ключевых отличий Cassandra от реляционных БД. <strong>Разные строки</strong> в одном column family могут иметь совершенно разные наборы столбцов — схема гибкая (schema-less / sparse)."
  },
  {
    q: "С чем ассоциируется строка (Row) в Cassandra?",
    opts: ["С именем таблицы", "С ключом строки (row key)", "С timestamp", "С именем пространства ключей"],
    ans: 1,
    diff: "easy",
    exp: "Строка — это коллекция столбцов, которая ассоциируется с <strong>ключом строки (row key)</strong>. Это аналог первичного ключа в реляционной БД."
  },
  {
    q: "Можно ли добавить новый столбец в семейство столбцов Cassandra без остановки системы?",
    opts: ["Нет, нужно пересоздать таблицу", "Да, столбцы можно добавлять и удалять в любой момент времени", "Только в режиме обслуживания (maintenance mode)", "Только если нет активных запросов"],
    ans: 1,
    diff: "easy",
    exp: "В Cassandra <strong>столбец можно добавить или удалить в любой момент</strong> без остановки системы. Это следствие гибкой схемы (schema-less)."
  },

  // ─── КАТЕГОРИЯ 2: Типы данных ───
  {
    cat: "🔢 Типы данных",
    q: "Какой тип данных используется для хранения UUID с временной меткой?",
    opts: ["UUIDType", "TimeUUIDType", "DateType", "LongType"],
    ans: 1,
    diff: "med",
    exp: "<strong>TimeUUIDType</strong> — это UUID первого типа, который содержит встроенную временну́ю метку. Обычный <code>UUIDType</code> поддерживает UUID 1-го или 4-го типа без обязательной временной составляющей."
  },
  {
    q: "Какой тип данных используется для реализации атомарного счётчика в Cassandra?",
    opts: ["IntegerType", "LongType", "CounterColumnType", "Int32Type"],
    ans: 2,
    diff: "med",

// State
let answered = new Set();
let correct = new Set();
let wrong = new Set();

function getDiff(d) {
  if (d === 'easy') return ['badge-easy', 'Лёгкий'];
  if (d === 'med') return ['badge-med', 'Средний'];
  return ['badge-hard', 'Сложный'];
}

function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  let currentCat = '';
  let catIndex = 0;
  const letters = ['A', 'B', 'C', 'D'];

  questions.forEach((q, qi) => {
    if (q.cat && q.cat !== currentCat) {
      currentCat = q.cat;
      catIndex++;
      const catDiv = document.createElement('div');
      catDiv.className = 'category-label';
      catDiv.innerHTML = `<span class="cat-icon">${q.cat.split(' ')[0]}</span><span class="cat-text">${q.cat.split(' ').slice(1).join(' ')}</span><div class="cat-line"></div>`;
      container.appendChild(catDiv);
    }

    const [badgeClass, badgeText] = getDiff(q.diff);
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `card-${qi}`;
    card.style.animationDelay = (qi * 0.03) + 's';

    const optsHTML = q.opts.map((opt, oi) => `
      <div class="opt" id="opt-${qi}-${oi}" onclick="selectAnswer(${qi}, ${oi})">
        <span class="opt-letter">${letters[oi]}</span>
        <span>${opt}</span>
      </div>
    `).join('');

    card.innerHTML = `
      <div class="q-header">
        <span class="q-num">${String(qi + 1).padStart(2, '0')}</span>
        <span class="q-text">${q.q}</span>
        <span class="q-badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="q-options">${optsHTML}</div>
      <div class="explanation" id="exp-${qi}">💡 ${q.exp}</div>
    `;

    container.appendChild(card);
  });
}

function selectAnswer(qi, oi) {
  if (answered.has(qi)) return;
  answered.add(qi);

  const q = questions[qi];
  const card = document.getElementById(`card-${qi}`);
  const exp = document.getElementById(`exp-${qi}`);
  const letters = ['A', 'B', 'C', 'D'];

  q.opts.forEach((_, optIdx) => {
    const optEl = document.getElementById(`opt-${qi}-${optIdx}`);
    optEl.style.pointerEvents = 'none';
    optEl.style.cursor = 'default';
    if (optIdx === q.ans) {
      optEl.classList.add(oi === q.ans ? 'correct' : 'revealed-correct');
    }
    if (optIdx === oi && oi !== q.ans) {
      optEl.classList.add('wrong');
    }
  });

  if (oi === q.ans) {
    correct.add(qi);
    card.classList.add('answered-correct');
  } else {
    wrong.add(qi);
    card.classList.add('answered-wrong');
  }

  exp.classList.add('show');
  updateStats();
}

function updateStats() {
  document.getElementById('s-answered').textContent = answered.size;
  document.getElementById('s-correct').textContent = correct.size;
  document.getElementById('s-wrong').textContent = wrong.size;

  const pct = Math.round((answered.size / questions.length) * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-pct').textContent = pct + '%';
}

function checkResults() {
  const total = questions.length;
  const c = correct.size;
  const w = wrong.size;
  const skipped = total - answered.size;
  const score = Math.round((c / total) * 100);

  let msg = '';
  if (score >= 90) msg = '🏆 Отлично! Вы блестяще знаете материал!';
  else if (score >= 75) msg = '🎯 Хороший результат! Ещё немного практики — и всё будет отлично.';
  else if (score >= 60) msg = '📚 Неплохо, но стоит повторить некоторые темы.';
  else if (score >= 40) msg = '⚠️ Нужно серьёзно повторить лекцию перед контролем.';
  else msg = '🔄 Рекомендуем внимательно перечитать конспект и пройти тест заново.';

  document.getElementById('res-score').textContent = score + '%';
  document.getElementById('res-title').textContent = 'Ваш результат: ' + c + ' из ' + total;
  document.getElementById('res-msg').textContent = msg;
  document.getElementById('rb-c').textContent = c;
  document.getElementById('rb-w').textContent = w;
  document.getElementById('rb-s').textContent = skipped;

  const panel = document.getElementById('results');
  panel.classList.add('show');
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetQuiz() {
  answered.clear();
  correct.clear();
  wrong.clear();
  document.getElementById('results').classList.remove('show');
  buildQuiz();
  updateStats();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuiz();
updateStats();
</script>
